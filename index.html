<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Το Φροντιστήριο Λόγος μεταφέρθηκε / Frontistirio Logos has moved</title>

    <!-- Άμεση ανακατεύθυνση (0 δευτερόλεπτα) στη νέα σελίδα -->
    <meta http-equiv="refresh" content="0; url=https://frontistirio.codeberg.page/logos/" />

    <!-- Ενημερώνει τη Google ότι η σελίδα μετακόμισε (SEO) -->
    <link rel="canonical" href="https://frontistirio.codeberg.page/logos/" />

    <style>
        body {
            background-color: #f5f5f7;
            color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        a {
            color: #0066cc;
            text-decoration: none;
            font-weight: 600;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h2>Το Φιλολογικό Φροντιστήριο Λόγος μεταφέρθηκε στο Codeberg!</h2>
    <p>Αν δεν μεταφερθείτε αυτόματα, <a id="linkEl" href="https://frontistirio.codeberg.page/logos/">πατήστε εδώ για τη νέα ιστοσελίδα</a>.</p>

    <br>

    <h2>Frontistirio Logos has moved to Codeberg!</h2>
    <p>If you are not redirected automatically, <a id="linkEn" href="https://frontistirio.codeberg.page/logos/">click here to visit the new website</a>.</p>

    <!-- Εφεδρική ανακατεύθυνση μέσω JavaScript.
         Διατηρεί τη σελίδα που ζητήθηκε (π.χ. /logos/yliko.html), ώστε να δουλεύουν και οι παλιοί σύνδεσμοι. -->
    <script>
        (function () {
            var base = "https://frontistirio.codeberg.page/logos/";
            var path = window.location.pathname.replace(/^\/logos\/?/, "");
            if (/^(index|404)\.html$/.test(path)) path = "";
            var target = base + path + window.location.search + window.location.hash;
            document.getElementById("linkEl").href = target;
            document.getElementById("linkEn").href = target;
            window.location.replace(target);
        })();
    </script>
</body>
</html>
